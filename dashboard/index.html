<meta charset="utf-8">
<title>Fly Brain Trader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a trading desk run by insects. The 3D stage and the nervous system share the top row;
   the swarm, the decision trace and the books sit underneath. One deliberate dark world. */
:root {
  color-scheme: dark;
  --void: #05070b;
  --deck: #0b0f16;
  --plate: #111722;
  --seam: #1d2533;
  --ink: #e9edf3;
  --dim: #8b95a7;
  --faint: #566174;
  --chitin: #e2b36f;      /* brand: the colour of a fly's thorax */
  --long: #39d98a;        /* feeding / long */
  --flee: #ff5b4f;        /* escape / sell */
  --sugar: #f7c04a;
  --bitter: #a68bff;
  --loom: #4cc8f0;
  --leg: #ffa06b;
  --display: "Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif;
  --sans: "IBM Plex Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --meme: Anton, Impact, "Arial Black", sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--void); color: var(--ink); }
body { font: 14px/1.5 var(--sans); }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
button, select { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--chitin); outline-offset: 2px; }

.app { max-width: 1680px; margin: 0 auto; padding-inline: 18px; padding-block: 14px 56px; display: grid; gap: 14px; }

/* top bar */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 28px; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
.mark { width: 38px; height: 38px; flex: none; }
.brand h1 { margin: 0; font: 800 26px/1 var(--display); letter-spacing: -0.01em; }
.brand p { margin: 3px 0 0; color: var(--dim); font-size: 12.5px; }
.brand p b { color: var(--ink); font-weight: 600; }
.status { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 26px; }
.pill { display: inline-flex; align-items: center; gap: 7px; font: 600 11px/1 var(--mono); letter-spacing: .12em; padding: 6px 10px; border-radius: 99px; border: 1px solid var(--seam); color: var(--dim); }
.pill.live { color: var(--long); border-color: color-mix(in srgb, var(--long) 45%, transparent); }
.pill.live i { width: 7px; height: 7px; border-radius: 50%; background: var(--long); box-shadow: 0 0 10px var(--long); animation: beat 1.6s infinite; }
@keyframes beat { 50% { opacity: .35; } }
.kpi { display: grid; gap: 2px; }
.kpi span { font-size: 11px; color: var(--dim); letter-spacing: .08em; text-transform: uppercase; }
.kpi b { font: 600 20px/1.1 var(--mono); font-variant-numeric: tabular-nums; }
.up { color: var(--long); } .down { color: var(--flee); }

/* top row */
.top { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 14px; }
@media (max-width: 1100px) { .top { grid-template-columns: minmax(0, 1fr); } }
.stage { position: relative; border-radius: 14px; overflow: hidden; background: var(--void); border: 1px solid var(--seam); aspect-ratio: 16 / 9; min-height: 380px; }
@media (max-width: 700px) { .stage { aspect-ratio: 9 / 14; } }
.stage canvas#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.ov { position: absolute; inset: 0; pointer-events: none; }
.caption { position: absolute; top: 3%; left: 0; right: 0; text-align: center; font: 800 clamp(18px, 2.4vw, 34px)/1.02 var(--display); letter-spacing: -0.01em; text-transform: uppercase; color: #fff; text-shadow: 0 2px 18px rgba(0,0,0,.9); padding-inline: max(16px, 18%); }
.caption small { display: block; font: 500 clamp(11px, 1vw, 14px)/1.4 var(--mono); letter-spacing: .14em; color: var(--chitin); margin-top: 8px; text-shadow: none; }
.meme { position: absolute; left: 50%; top: 33%; transform: translate(-50%, -50%); display: grid; place-items: center; }
.meme b { font: 400 clamp(48px, 7.5vw, 112px)/1 var(--meme); color: #fff; -webkit-text-stroke: clamp(3px, .5vw, 7px) #000; paint-order: stroke fill; letter-spacing: .01em; filter: drop-shadow(0 6px 0 rgba(0,0,0,.6)); white-space: nowrap; position: relative; }
.meme svg { position: absolute; width: 150%; height: 190%; overflow: visible; }
.meme.pop { animation: pop .5s cubic-bezier(.2, 1.6, .4, 1) both; }
@keyframes pop { from { transform: translate(-50%, -50%) scale(.2) rotate(-12deg); opacity: 0; } }
.sub { position: absolute; bottom: 7%; left: 0; right: 0; text-align: center; font: 700 clamp(15px, 1.8vw, 24px)/1.2 var(--display); color: #fff; text-shadow: 0 2px 12px #000, 0 0 2px #000; padding-inline: 16px; }
.hud { position: absolute; top: 14px; left: 14px; display: grid; gap: 2px; font: 500 12px var(--mono); color: var(--dim); }
.hud b { font: 600 clamp(15px, 1.6vw, 20px) var(--mono); color: var(--ink); }
.hud-r { left: auto; right: 14px; text-align: right; }
@media (max-width: 700px) { .hud { top: auto; bottom: 64px; } }
.chips { position: absolute; bottom: 14px; left: 14px; display: flex; flex-wrap: wrap; gap: 6px; max-width: 60%; }
.chip { font: 600 11px/1 var(--mono); padding: 6px 8px; border-radius: 6px; background: rgba(10,14,20,.72); border: 1px solid var(--seam); color: var(--faint); }
.chip.on { color: var(--c); border-color: color-mix(in srgb, var(--c) 50%, transparent); box-shadow: 0 0 14px color-mix(in srgb, var(--c) 30%, transparent); }
.cash { position: absolute; font: 800 26px var(--display); color: var(--long); text-shadow: 0 0 10px rgba(57,217,138,.6); animation: rise 1.4s ease-out forwards; }
@keyframes rise { to { transform: translateY(-160px) rotate(var(--r)); opacity: 0; } }

.transport { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: linear-gradient(transparent, rgba(5,7,11,.92) 40%); pointer-events: auto; opacity: 0; transition: opacity .25s; }
.stage:hover .transport, .stage:focus-within .transport { opacity: 1; }
.stage:hover .chips, .stage:focus-within .chips { opacity: 0; }
.tbtn { background: rgba(255,255,255,.08); border: 1px solid var(--seam); border-radius: 7px; padding: 6px 11px; font: 600 12px var(--sans); cursor: pointer; white-space: nowrap; }
.tbtn:hover { background: rgba(255,255,255,.14); }
.tbtn.hot { background: var(--chitin); color: #1a1208; border-color: transparent; }
.track { position: relative; flex: 1; height: 26px; min-width: 80px; cursor: pointer; }
.track canvas { width: 100%; height: 100%; display: block; }
.when { font: 500 12px var(--mono); color: var(--dim); white-space: nowrap; }
@media (max-width: 700px) { .transport { flex-wrap: wrap; opacity: 1; } .when { display: none; } .chips { display: none; } }

/* nervous system */
.cns { background: var(--deck); border: 1px solid var(--seam); border-radius: 14px; display: grid; grid-template-rows: auto minmax(340px, 1fr) auto; overflow: hidden; }
.cns header { padding: 12px 14px 0; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.cns h2, .panel h2 { margin: 0; font: 700 15px var(--display); letter-spacing: .01em; }
.cns header span { font: 500 11px var(--mono); color: var(--dim); }
.cns .map { position: relative; min-height: 0; }
.cns canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.cns footer { padding: 8px 14px 12px; display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11.5px; color: var(--dim); border-top: 1px solid var(--seam); }
.cns footer i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }

/* swarm */
.swarm { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 1100px) { .swarm { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 560px) { .swarm { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.fly { text-align: left; background: var(--deck); border: 1px solid var(--seam); border-radius: 12px; padding: 10px 12px 12px; cursor: pointer; display: grid; gap: 6px; min-width: 0; }
.fly:hover { border-color: var(--faint); }
.fly[aria-pressed="true"] { border-color: var(--chitin); background: linear-gradient(180deg, color-mix(in srgb, var(--chitin) 10%, var(--deck)), var(--deck)); }
.fly .row { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.fly .sym { font: 800 17px var(--display); }
.fly .act { font: 600 10px/1 var(--mono); letter-spacing: .1em; padding: 4px 6px; border-radius: 4px; background: var(--plate); color: var(--dim); }
.fly .act.FEED { color: var(--long); background: color-mix(in srgb, var(--long) 14%, transparent); }
.fly .act.ESCAPE { color: var(--flee); background: color-mix(in srgb, var(--flee) 16%, transparent); }
.fly .act.RETREAT { color: var(--bitter); background: color-mix(in srgb, var(--bitter) 16%, transparent); }
.fly canvas { width: 100%; height: 46px; display: block; }
.fly .pnl { font: 600 15px var(--mono); }
.fly .vs { font: 500 11px var(--mono); color: var(--dim); }
.meter { height: 4px; border-radius: 2px; background: var(--plate); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--long); border-radius: 2px; transition: width .3s; }

/* lower panels */
.lower { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 1100px) { .lower { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--deck); border: 1px solid var(--seam); border-radius: 14px; padding: 14px; display: grid; gap: 12px; min-width: 0; }
.panel .head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.panel .head span { font: 500 11.5px var(--mono); color: var(--dim); }

.trace { display: grid; grid-template-columns: minmax(0, 1.15fr) 120px minmax(0, 1fr); gap: 12px; }
@media (max-width: 640px) { .trace { grid-template-columns: minmax(0, 1fr); } .core { border: 0; } }
.col h3 { margin: 0 0 6px; font: 600 10.5px var(--mono); letter-spacing: .14em; color: var(--faint); text-transform: uppercase; }
.sig { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; padding: 6px 0; border-top: 1px solid var(--seam); }
.sig:first-child { border-top: 0; }
.sig .n { font-size: 12.5px; }
.sig .n small { display: block; font: 400 11px var(--mono); color: var(--faint); }
.sig .v { font: 600 13px var(--mono); text-align: right; align-self: center; }
.sig .b { grid-column: 1 / -1; height: 3px; background: var(--plate); border-radius: 2px; overflow: hidden; }
.sig .b i { display: block; height: 100%; border-radius: 2px; background: var(--c); transition: width .25s; }
.core { display: grid; align-content: center; justify-items: center; text-align: center; gap: 4px; border-inline: 1px dashed var(--seam); padding: 10px 6px; }
.core b { font: 700 24px var(--mono); }
.core small { font: 500 10.5px var(--mono); color: var(--dim); }
.verdict { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; border-radius: 10px; background: var(--plate); flex-wrap: wrap; }
.verdict b { font: 800 20px var(--display); }
.verdict span { font: 500 12px var(--mono); color: var(--dim); }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--seam); overflow-x: auto; }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 10px; font: 600 13px var(--sans); color: var(--dim); cursor: pointer; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-color: var(--chitin); }
.tablewrap { overflow: auto; max-height: 360px; }
table { width: 100%; border-collapse: collapse; font: 12.5px var(--mono); font-variant-numeric: tabular-nums; }
th { position: sticky; top: 0; background: var(--deck); color: var(--faint); font: 600 10.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; text-align: right; padding: 7px 8px; white-space: nowrap; }
td { text-align: right; padding: 6px 8px; border-top: 1px solid var(--seam); white-space: nowrap; }
th:nth-child(-n+3), td:nth-child(-n+3) { text-align: left; }
tbody tr { cursor: pointer; } tbody tr:hover { background: var(--plate); }
.tag { font: 600 10px var(--mono); letter-spacing: .08em; padding: 3px 6px; border-radius: 4px; background: var(--plate); color: var(--dim); }
.tag.ESCAPE { color: var(--flee); } .tag.open { color: var(--ink); }
.exps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 640px) { .exps { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.exp { text-align: left; background: var(--plate); border: 1px solid var(--seam); border-radius: 9px; padding: 9px 10px; cursor: pointer; display: grid; gap: 4px; }
.exp[aria-pressed="true"] { border-color: var(--chitin); }
.exp b { font: 700 13.5px var(--display); }
.exp span { font: 500 11px var(--mono); color: var(--dim); }
.prose { color: var(--dim); max-width: 74ch; display: grid; gap: 10px; font-size: 13.5px; }
.prose p { margin: 0; }
.prose b { color: var(--ink); font-weight: 600; }
.prose h4 { margin: 6px 0 0; color: var(--ink); font: 700 14px var(--display); }
.eq { width: 100%; height: 200px; display: block; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; font: 500 13px var(--mono); color: var(--dim); background: var(--void); }
@media (prefers-reduced-motion: reduce) { .meme.pop, .cash, .pill.live i { animation: none; } }
</style>

<div class="app">
  <div class="bar">
    <div class="brand">
      <svg class="mark" viewBox="0 0 40 40" aria-hidden="true">
        <path d="M14 20 Q3 13 4 30 Q10 27 14 24Z M26 20 Q37 13 36 30 Q30 27 26 24Z" fill="#cfe0f5" opacity=".5"/>
        <ellipse cx="20" cy="23" rx="7" ry="10" fill="#e2b36f"/>
        <ellipse cx="13" cy="12.5" rx="5" ry="6" fill="#d32a2a"/><ellipse cx="27" cy="12.5" rx="5" ry="6" fill="#d32a2a"/>
        <path d="M7 37 L15 29 L20 33 L33 19" stroke="#39d98a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div><h1>Fly Brain Trader</h1><p id="tagline">Loading the connectome…</p></div>
    </div>
    <div class="status" id="status"></div>
  </div>

  <div class="top">
    <section class="stage" id="stage" aria-label="3D fly trading, driven by its simulated nervous system">
      <canvas id="gl"></canvas>
      <div class="ov">
        <div class="caption" id="caption"></div>
        <div class="hud" id="hudL"></div>
        <div class="hud hud-r" id="hudR"></div>
        <div class="meme" id="meme" hidden></div>
        <div id="cashLayer"></div>
        <div class="chips" id="chips"></div>
        <div class="sub" id="sub"></div>
      </div>
      <div class="transport" id="transport">
        <button class="tbtn hot" id="play">Pause</button>
        <button class="tbtn" id="next" title="Jump to the next buy or escape">Next trade</button>
        <div class="track" id="track"><canvas id="trackCv"></canvas></div>
        <select class="tbtn" id="speed" aria-label="Playback speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select>
        <button class="tbtn" id="liveBtn" hidden>Go live</button>
        <span class="when" id="when"></span>
      </div>
      <div class="loading" id="loading">Wiring 169,078 neurons…</div>
    </section>

    <section class="cns" aria-label="The fly's whole central nervous system">
      <header><h2>Central nervous system</h2><span id="cnsInfo"></span></header>
      <div class="map"><canvas id="cns"></canvas></div>
      <footer>
        <span><i style="background:var(--sugar)"></i>sugar</span><span><i style="background:var(--bitter)"></i>bitter</span>
        <span><i style="background:var(--leg)"></i>leg taste</span><span><i style="background:var(--loom)"></i>looming</span>
        <span><i style="background:var(--long)"></i>feeding</span><span><i style="background:var(--flee)"></i>escape</span>
        <span><i style="background:#dfe9ff"></i>other spikes</span>
      </footer>
    </section>
  </div>

  <div class="swarm" id="swarm" role="group" aria-label="The swarm: one fly per coin"></div>

  <div class="lower">
    <section class="panel">
      <div class="head"><h2>Why it did that</h2><span id="traceWhen"></span></div>
      <div class="trace">
        <div class="col"><h3>Senses</h3><div id="senses"></div></div>
        <div class="core"><small>neurons spiking</small><b id="active">0</b><small id="activeOf"></small><small id="dnActive"></small></div>
        <div class="col"><h3>Motor output</h3><div id="motor"></div></div>
      </div>
      <div class="verdict" id="verdict"></div>
    </section>
    <section class="panel">
      <div class="head"><h2>Equity</h2><span id="eqInfo"></span></div>
      <canvas class="eq" id="equity" aria-label="Equity of the selected fly, buy and hold, and the whole swarm"></canvas>
    </section>
  </div>

  <section class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-tab="trades">Trades</button>
      <button role="tab" aria-selected="false" data-tab="lab">Lab experiments</button>
      <button role="tab" aria-selected="false" data-tab="model">How it works</button>
    </div>
    <div data-pane="trades">
      <div class="tablewrap"><table><thead><tr><th>Coin</th><th>Entry</th><th>Exit</th><th>Held</th><th>Max size</th><th>Entry $</th><th>Exit $</th><th>Ended by</th><th>Return</th></tr></thead><tbody id="trades"></tbody></table></div>
    </div>
    <div data-pane="lab" hidden>
      <div class="exps" id="exps"></div>
      <p class="prose" id="expNote" style="margin-top:10px"></p>
    </div>
    <div data-pane="model" hidden class="prose" id="model"></div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script src="fly3d.js"></script>
<script src="app.js"></script>
